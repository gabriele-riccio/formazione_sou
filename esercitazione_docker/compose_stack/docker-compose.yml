version: "3.9"

services:               
  backend:              
    build: ./backend   
    ports:
      - "5000:5000"
    volumes:
      - dati-condivisi:/dati
    networks:
      - rete-stack
    depends_on:          
      - redis 

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - dati-condivisi:/dati
    networks:
      - rete-stack
    depends_on:          
      - redis
      - backend

  redis:
    image: redis:alpine
    networks:
      - rete-stack

volumes:                 
  dati-condivisi:

networks:                
  rete-stack:
